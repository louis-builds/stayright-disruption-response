services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: travel-disruption-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_disruption}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - travel_disruption_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-travel_disruption}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_disruption_pgdata_v2:
