services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-disruption-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_disruption}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - travel_disruption_pgdata:/var/lib/postgresql/data
      # Only runs on a brand-new (empty) volume -- creates the separate
      # `kakapo` database for the Python detect/identify prototype and
      # loads its schema/seed data. See db/init/01-init-kakapo.sql.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./detect/seed_data:/seed_data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-travel_disruption}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_disruption_pgdata:
