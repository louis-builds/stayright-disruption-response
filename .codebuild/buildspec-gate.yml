version: 0.2

# gate 的三项检查：pytest（detect/）+ dotnet build（backend/）+ 前端 lint/build。
# 执行环境是 CodeBuild——这个仓库所在组织把 Actions 限制成 local_only，
# 原来的 .github/workflows/gate.yml 每次都 startup_failure，已删除（见
# docs/AWS_SDK_SPEC.md §12）。
#
# 两处引用同一个 buildspec：
#   - stayright-gate      CodePipeline 的 Gate stage（main 合并后）
#   - stayright-gate-pr    GitHub webhook（PR 进 Test / main），结果回写 PR
#
# 三项全部通过才算 gate 通过；任一失败 CodeBuild 直接非零退出，
# CodePipeline 的这个 stage 标红 / PR 的 commit status 标红，后面不会往下走。

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      - curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 9.0 --install-dir /usr/share/dotnet
      - ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet

  build:
    commands:
      - echo "== Python (detect/) =="
      - cd detect && pip install -r requirements.txt && pytest && cd ..

      - echo "== Backend (.NET build) =="
      - cd backend && dotnet restore backend.sln && dotnet build backend.sln --no-restore --configuration Release && cd ..

      - echo "== Frontend (lint + build) =="
      - cd frontend && npm ci && npm run lint && npm run build && cd ..
