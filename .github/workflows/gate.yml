name: Gate

# DRAFT — not yet confirmed with Zachary. He deleted this file in 3cf59b2
# ("commit to AWS CodePipeline, drop GitHub Actions") because the org's
# Actions policy is "local_only" and every job here used to start with a
# third-party action (actions/checkout, actions/setup-*), which that policy
# blocks outright — hence the permanent startup_failure.
#
# None of those actions are actually load-bearing though: checkout is just
# "git clone this commit", setup-* is just "put a language runtime on PATH".
# Every step below does that with plain shell instead, so this workflow runs
# fine under local_only, with no org-level permission change needed. Whether
# to bring it back alongside (or instead of) .codebuild/buildspec-gate.yml —
# and risk maintaining two parallel gates — is Zachary's call, not something
# to merge unilaterally.

on:
  pull_request:
    branches: [Test2]
  push:
    branches: [Test2]

jobs:
  python:
    name: Python (detect/)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref == 'Dev-Zachary'
    defaults:
      run:
        working-directory: detect
    steps:
      - name: Checkout (no actions/checkout — see policy note above)
        run: |
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Python toolchain
        run: python3 --version   # ubuntu-latest's system python3 is already 3.12
      - run: pip install -r requirements.txt
      - run: pytest

  backend:
    name: Backend (.NET build)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref == 'Dev-Zachary'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout (no actions/checkout — see policy note above)
        run: |
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Install .NET 9 SDK (same install script as .codebuild/buildspec-gate.yml)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
      - run: dotnet restore backend.sln
      - run: dotnet build backend.sln --no-restore --configuration Release

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref == 'Dev-Zachary'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout (no actions/checkout — see policy note above)
        run: |
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Node toolchain
        run: node --version   # ubuntu-latest ships Node preinstalled; nvm is also on PATH if a specific version is ever needed
      - run: npm ci
      - run: npm run lint
      - run: npm run build
